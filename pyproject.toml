[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "afterbook"
dynamic = ["version"]
description = "Preserve ebook reader highlights and notes as personal books you can keep"
keywords = ["ebook", "epub", "highlights", "annotations", "kobo", "overdrive", "libby"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Suyash Shekhar", email = "suyashshekhar@gmail.com" },
]
dependencies = [
    "questionary>=2.0,<3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sushinoya/afterbook"
Repository = "https://github.com/sushinoya/afterbook"
Issues = "https://github.com/sushinoya/afterbook/issues"

[project.scripts]
afterbook = "afterbook.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8",
    "ruff==0.16.4",
]

[tool.setuptools]
packages = ["afterbook", "afterbook.readers", "afterbook.readers.kobo"]

[tool.setuptools.dynamic]
version = { attr = "afterbook.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["afterbook"]

[[tool.mypy.overrides]]
module = ["questionary", "questionary.*"]
ignore_missing_imports = true
